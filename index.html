const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  for (const b of dados.blocos) {
    const c = hex(b.c), t = hex(b.t);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(b.s), iterations: dados.iter }, base, (c.length + 16) * 8);
    const k = new Uint8Array(bits);
    // confere se a senha abriu este bloco
    if (t.every((v, i) => v === k[c.length + i])) {
      return new TextDecoder().decode(c.map((v, i) => v ^ k[i])).trim();
    }
  }
  return null;
}

document.getElementById("ok").onclick = async () => {
  const res = document.getElementById("res");
  const senha = document.getElementById("senha").value.trim().toUpperCase();
  res.textContent = "Abrindo...";
  const amigo = await abrir(senha);
  res.innerHTML = amigo ? "Seu amigo secreto é:<b></b>" : "Senha incorreta";
  if (amigo) res.querySelector("b").textContent = amigo;
};
